interface:
  display_name: "Erstan Run Operator"
  short_description: "Run Erstan Agents and handle waits"
  default_prompt: "Use $erstan-run-operator to run this published Erstan Agent and handle its interactions safely."
dependencies:
  tools:
    - type: "mcp"
      value: "erstan-beta"
      description: "Erstan hosted MCP server"
      transport: "streamable_http"
      url: "https://api-qa.erstan.com/v1/mcp"
policy:
  allow_implicit_invocation: true
