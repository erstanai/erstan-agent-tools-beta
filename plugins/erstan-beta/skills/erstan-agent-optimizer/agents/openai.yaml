interface:
  display_name: "Erstan Agent Optimizer"
  short_description: "Optimize Agents from versioned run evidence"
  default_prompt: "Use $erstan-agent-optimizer to retrieve this Agent and produce an evidence-backed optimization proposal."
dependencies:
  tools:
    - type: "mcp"
      value: "erstan-beta"
      description: "Erstan hosted MCP server"
      transport: "streamable_http"
      url: "https://api-qa.erstan.com/v1/mcp"
policy:
  allow_implicit_invocation: true
